# Cross-cluster agentic access to a model, via Keycloak OIDC and MaaS subscriptions.
#
# Design: agents authenticate via Keycloak client-credentials flow. Each agent
# type (chatbot, code-reviewer, business-analyst) maps to a Keycloak GROUP,
# and each group gets its own MaaSAuthPolicy + MaaSSubscription tier.
#
# Per-agent overrides use a higher-priority subscription matching the specific
# agent's Keycloak service-account username (preferred_username claim:
# "service-account-<client_id>").
#
# This runs in the dedicated agents tenant namespace (ai-tenant-agents), fully
# isolated from the default MaaS tenant.
#
#   MaaSAuthPolicy    (group)  -> every agent in the group may call the model
#   MaaSSubscription  (group, priority 35)  -> group-level default tier
#   MaaSSubscription  (user,  priority 50)  -> per-agent premium override
#
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: agents-chatbots-access
  namespace: ai-tenant-agents
  annotations:
    openshift.io/display-name: "Chatbot agents"
    openshift.io/description: "Grants all chatbot agents access to the simulator model"
spec:
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
  subjects:
    groups:
      - name: chatbots
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: agents-reviewers-access
  namespace: ai-tenant-agents
  annotations:
    openshift.io/display-name: "Code reviewer agents"
    openshift.io/description: "Grants all code-reviewer agents access to the simulator model"
spec:
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
  subjects:
    groups:
      - name: code-reviewers
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: agents-analysts-access
  namespace: ai-tenant-agents
  annotations:
    openshift.io/display-name: "Business analyst agents"
    openshift.io/description: "Grants all business-analyst agents access to the simulator model"
spec:
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
  subjects:
    groups:
      - name: business-analysts
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: agents-chatbots-tier
  namespace: ai-tenant-agents
  annotations:
    openshift.io/display-name: "Chatbots group tier"
    openshift.io/description: "Default rate limit for all chatbot agents"
spec:
  owner:
    groups:
      - name: chatbots
    users: []
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 500
          window: 1m
  priority: 35
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: agents-reviewers-tier
  namespace: ai-tenant-agents
  annotations:
    openshift.io/display-name: "Code reviewers group tier"
    openshift.io/description: "Default rate limit for all code-reviewer agents"
spec:
  owner:
    groups:
      - name: code-reviewers
    users: []
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 200
          window: 1m
  priority: 35
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: agents-analysts-tier
  namespace: ai-tenant-agents
  annotations:
    openshift.io/display-name: "Business analysts group tier"
    openshift.io/description: "Default rate limit for all business-analyst agents"
spec:
  owner:
    groups:
      - name: business-analysts
    users: []
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 300
          window: 1m
  priority: 35
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: agents-chatbot-2-premium
  namespace: ai-tenant-agents
  annotations:
    openshift.io/display-name: "chatbot-2 premium override"
    openshift.io/description: "Higher throughput for chatbot-2 (overrides group tier)"
spec:
  owner:
    groups: []
    users:
      - service-account-chatbot-2
  modelRefs:
    - name: facebook-opt-125m-simulated
      namespace: llm
      tokenRateLimits:
        - limit: 2000
          window: 1m
  priority: 50

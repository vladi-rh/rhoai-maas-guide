<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaaS Agent Console</title>
<style>
/* Dracula palette — same values as shared.sh's D_* codes, so the UI and the
   colour-coded log tail in follow-agents.sh read as one thing. */
:root {
  --bg:        #282A36;
  --panel:     #21222C;
  --line:      #44475A;
  --fg:        #F8F8F2;
  --comment:   #6272A4;
  --cyan:      #8BE9FD;
  --green:     #50FA7B;
  --orange:    #FFB86C;
  --pink:      #FF79C6;
  --purple:    #BD93F9;
  --red:       #FF5555;
  --yellow:    #F1FA8C;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 28px 48px;
  background: var(--bg); color: var(--fg);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 14px; line-height: 1.5;
}
a { color: var(--cyan); }

header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .5px; }
h1 .accent { color: var(--pink); }
.sub { color: var(--comment); font-size: 12px; }
/* No margin-left:auto here — it pinned #poll right while it lived in the header's flex
   row, and inside the toolbar's centre column it would push the text off-centre. */
#poll { color: var(--comment); font-size: 12px; }
#poll.stale { color: var(--red); }

/* ── Global controls ──────────────────────────────────────────────────── */
/* 1fr / auto / 1fr so the stats are centred against the toolbar itself, not against
   whatever the left-hand buttons happen to measure. Reset lives at the far right,
   deliberately out of mis-click range of Stop all. */
.toolbar {
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 12px;
  margin: 18px 0 14px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
.tb-left  { display: flex; gap: 10px; align-items: center; }
/* Centre cell stacks the stats with the freshness timestamp that qualifies them. */
.tb-center { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tb-right { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
/* Below ~1100px the three groups no longer fit on one line; stack them left-aligned
   rather than letting the centre column get crushed. */
@media (max-width: 1100px) {
  .toolbar { grid-template-columns: 1fr; }
  .tb-right { justify-content: flex-start; }
}
button {
  font: inherit; font-size: 13px; cursor: pointer;
  padding: 7px 14px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--line); color: var(--fg);
  transition: filter .12s ease;
}
button:hover:not(:disabled) { filter: brightness(1.25); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--green); border-color: var(--green); color: #1d2b20; font-weight: 700; }
button.danger  { background: var(--red);   border-color: var(--red);   color: #2b1d1d; font-weight: 700; }
.runhint { color: var(--comment); font-size: 11px; font-style: italic; }

/* ── Aggregate strip ──────────────────────────────────────────────────── */
.totals { display: flex; gap: 26px; flex-wrap: wrap; align-items: center; }
.tot { display: flex; flex-direction: column; }
.tot .k { color: var(--comment); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
.tot .v { font-size: 20px; font-weight: 700; }

/* ── Agent cards ──────────────────────────────────────────────────────── */
/* One block per agent group so the types stack vertically; cards flow within a group. */
.grid { display: block; }
.group { margin-bottom: 24px; }
.group-head { display: flex; align-items: center; gap: 10px; margin: 0 0 9px 2px; }
.group-head .dot { width: 11px; height: 11px; }
.group-head h2 {
  font-size: 13px; margin: 0; font-weight: 700;
  letter-spacing: .8px; text-transform: uppercase; color: var(--accent);
}
.group-head .gmeta { color: var(--comment); font-size: 11px; }
.group-head .rule { flex: 1; height: 1px; background: var(--line); }
.row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-left: 4px solid var(--accent, var(--comment));
  border-radius: 8px; padding: 14px 16px;
}
.card.unreachable { opacity: .55; }
/* Two things pulse on a rejected key, in step: the LAST status tile and the
   KEY row's error text — hence an unscoped class both can share. Blinks only
   while the status is genuinely an error, and no timer drives it: the next 2xx
   re-render simply drops the class. An earlier version pulsed the whole card
   instead, which read as an alarm for something already recovered from. */
@keyframes lastErrBlink { 50% { opacity: .25; } }
.blink { animation: lastErrBlink .7s steps(1, end) infinite; }
.rejcount { font-size: 10px; color: var(--comment); letter-spacing: .5px; }
.card-head { display: flex; align-items: center; gap: 9px; margin-bottom: 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
.name { font-weight: 700; font-size: 15px; }
.badge {
  font-size: 10px; letter-spacing: .7px; text-transform: uppercase;
  padding: 2px 7px; border-radius: 10px; border: 1px solid currentColor;
}
.badge.running     { color: var(--green); }
.badge.starting    { color: var(--cyan); }
.badge.stopping    { color: var(--orange); }
.badge.idle        { color: var(--comment); }
.badge.unreachable,
.badge.error       { color: var(--red); }
.creds { margin: 2px 0 11px; }
/* One line, always. Without nowrap the value wrapped under the JWT/KEY label
   whenever it grew ("failed · revoked" is longer than "valid 3m46s"), so the
   row changed height and the text moved — exactly when you are trying to read
   it. The value keeps its slot right after the label and never shrinks; the
   age is what gives way, truncating on a narrow card. */
.cred { display: flex; align-items: baseline; gap: 7px; font-size: 11px;
        line-height: 1.7; white-space: nowrap; }
.cred .ci { width: 13px; flex: none; }
.cred .cl { color: var(--comment); width: 26px; flex: none;
            font-weight: 700; letter-spacing: .5px; }
.cred .cv { font-weight: 600; flex: none; }
.cred .cv.dim { color: var(--comment); font-weight: 400; }
.cred .cage { color: var(--comment); margin-left: auto; padding-left: 7px;
              flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

/* Toggle switch */
.toggle { margin-left: auto; position: relative; width: 44px; height: 24px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; cursor: pointer; border-radius: 24px;
  background: var(--line); transition: background .15s ease;
}
.slider::before {
  content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
  border-radius: 50%; background: var(--fg); transition: transform .15s ease;
}
.toggle input:checked + .slider { background: var(--green); }
.toggle input:checked + .slider::before { transform: translateX(20px); }
.toggle input:disabled + .slider { cursor: not-allowed; opacity: .4; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px 6px; margin-bottom: 11px; }
.stat .k { color: var(--comment); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
.stat .v { font-size: 15px; font-weight: 600; }
.v.ok  { color: var(--green); }
.v.c4  { color: var(--orange); }
.v.c5  { color: var(--red); }

/* 2xx vs 4xx/5xx ratio bar */
.bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .s2 { background: var(--green); }
.bar .s4 { background: var(--orange); }
.bar .s5 { background: var(--red); }
.barlbl { display: flex; justify-content: space-between; color: var(--comment); font-size: 11px; margin-top: 5px; }

/* ── Tabs ─────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--line); }
.tab {
  font: inherit; font-size: 13px; cursor: pointer; padding: 8px 18px;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--comment); border-radius: 0;
}
.tab:hover:not(.active) { color: var(--fg); filter: none; }
.tab.active { color: var(--fg); border-bottom-color: var(--pink); font-weight: 700; }
.tab .count { color: var(--comment); font-size: 11px; font-weight: 400; }
.pane { display: none; }
.pane.active { display: block; }

/* ── Log pane ─────────────────────────────────────────────────────────── */
.logbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 10px; }
.logbar select, .logbar button { font: inherit; font-size: 12px; }
.logbar select {
  padding: 6px 8px; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 5px;
}
.logbar .legend { display: flex; gap: 14px; margin-left: auto; font-size: 11px; color: var(--comment); }
.logbar .legend span { display: flex; align-items: center; gap: 5px; }
.logbar .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chips { display: flex; gap: 6px; }
.chip {
  font: inherit; font-size: 11px; padding: 5px 10px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--comment);
}
.chip:hover:not(:disabled) { filter: brightness(1.3); }
.chip.off { opacity: .45; text-decoration: line-through; }
/* 201 shares the 2xx green and 0 shares the "other" grey: they are split out for
   findability, not because they are a different severity. */
.chip[data-cls="2xx"]:not(.off)   { border-color: var(--green);   color: var(--green); }
.chip[data-cls="201"]:not(.off)   { border-color: var(--green);   color: var(--green); }
.chip[data-cls="4xx"]:not(.off)   { border-color: var(--orange);  color: var(--orange); }
.chip[data-cls="5xx"]:not(.off)   { border-color: var(--red);     color: var(--red); }
.chip[data-cls="0"]:not(.off)     { border-color: var(--comment); color: var(--fg); }
.chip[data-cls="other"]:not(.off) { border-color: var(--comment); color: var(--fg); }
.chip b { font-weight: 700; }
#logview {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; height: 60vh; overflow-y: auto;
  font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
}
#logview .l { display: block; }
#logview .l .who { font-weight: 700; }
#logview .l .ts { color: var(--comment); }
#logview .empty { color: var(--comment); font-style: italic; }

.foot { margin-top: 22px; color: var(--comment); font-size: 11px; }
.err { color: var(--red); font-size: 11px; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>

<header>
  <h1>MaaS <span class="accent">Agent Console</span></h1>
  <span class="sub">cross-cluster-oauth demo</span>
</header>

<div class="toolbar">
  <div class="tb-left">
    <button id="startAll" class="primary"
            title="Start every agent. Each repeats its profile pattern until stopped.">▶ Start all</button>
    <button id="stopAll" class="danger"
            title="Stop every agent. Pods stay up and counters are kept.">■ Stop all</button>
  </div>
  <div class="tb-center">
    <div class="totals" id="totals"></div>
    <span id="poll">connecting…</span>
  </div>
  <div class="tb-right">
    <button id="resetAll" title="Zero every agent's counters. Does not stop traffic.">↺ Reset counters</button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-pane="agents">Agents</button>
  <button class="tab" data-pane="logs">Logs <span class="count" id="logCount"></span></button>
</div>

<div class="pane active" id="pane-agents">
  <div class="grid" id="grid"></div>
</div>

<div class="pane" id="pane-logs">
  <div class="logbar">
    <select id="logFilter"><option value="">all agents</option></select>
    <span class="chips" id="logChips">
      <button class="chip" data-cls="2xx"   title="Successful calls (HTTP 2xx) excluding 201 — in practice the 200s from inference and token mint">2xx <b>0</b></button>
      <button class="chip" data-cls="201"   title="HTTP 201 — a MaaS API key was minted. Once per agent per hour, so easy to miss among the 200s">201 <b>0</b></button>
      <button class="chip" data-cls="4xx"   title="Client errors (HTTP 4xx) — 403 on revoked access, 429 on rate limit">4xx <b>0</b></button>
      <button class="chip" data-cls="5xx"   title="Server errors (HTTP 5xx) — e.g. 503 when the gateway wasm filter is failing closed">5xx <b>0</b></button>
      <button class="chip" data-cls="0"     title="[0] — transport failure with no HTTP response at all: DNS, TLS, connection refused or timeout">0 <b>0</b></button>
      <button class="chip" data-cls="other" title="Lines with no HTTP status — started/stopped, pod ready, pattern notices">other <b>0</b></button>
    </span>
    <button id="logPause">⏸ Pause</button>
    <button id="logClear">Clear</button>
    <span class="runhint" id="logStatus"></span>
    <span class="legend" id="logLegend"></span>
  </div>
  <div id="logview"><span class="empty">waiting for log lines…</span></div>
</div>

<p class="foot">
  Polling <code>/api/status</code> every 2s. Counters are in-memory per pod and
  reset if a pod restarts — watch <em>uptime</em> if a number drops unexpectedly.
</p>

<script>
const POLL_MS = 2000;
let busy = new Set();     // agent ids with an in-flight start/stop
let lastOk = 0;

const fmtNum = n => (n ?? 0).toLocaleString();

function fmtDur(s) {
  if (s == null) return "—";
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h) return `${h}h${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m${String(sec).padStart(2, "0")}s`;
  return `${sec}s`;
}

function ratioText(r) {
  return r == null ? "—" : `${(r * 100).toFixed(1)}%`;
}

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`${method} ${path} → ${res.status}`);
  return res.json();
}

function renderTotals(t) {
  document.getElementById("totals").innerHTML = `
    <div class="tot"><span class="k">Agents running</span>
      <span class="v" style="color:${t.agents_running ? "var(--green)" : "var(--comment)"}">
        ${t.agents_running}/${t.agents_total}</span></div>
    <div class="tot"><span class="k">Requests</span><span class="v">${fmtNum(t.requests)}</span></div>
    <div class="tot"><span class="k">Tokens</span><span class="v">${fmtNum(t.tokens)}</span></div>
    <div class="tot"><span class="k">2xx</span><span class="v ok">${fmtNum(t.ok)}</span></div>
    <div class="tot"><span class="k">4xx/5xx</span>
      <span class="v ${t.errors ? "c5" : ""}">${fmtNum(t.errors)}</span></div>
    <div class="tot"><span class="k">Success</span>
      <span class="v" style="color:${t.success_ratio == null ? "var(--comment)"
        : t.success_ratio > 0.95 ? "var(--green)"
        : t.success_ratio > 0.5 ? "var(--orange)" : "var(--red)"}">
      ${ratioText(t.success_ratio)}</span></div>`;
}

// One credential line: how long it stays valid, and how long ago it was fetched.
// age_s / ttl_s are computed agent-side, so no browser-clock reconciliation.
//
// Note: the JWT is only used to mint an API key, and the key is cached for an hour, so an
// expired JWT is usually harmless — it gets re-minted on the next key refresh. Shown red
// anyway, deliberately: an explicit signal beats a hidden one.
function credRow(icon, label, c, opts = {}) {
  const row = (body) => `<div class="cred" title="${esc(opts.title || "")}">` +
    `<span class="ci">${icon}</span><span class="cl">${label}</span>${body}</div>`;
  if (!c) return row(`<span class="cv dim">—</span>`);
  // Same .blink as the LAST status tile, so the two red things on the card
  // pulse together and read as one event rather than two separate alarms.
  if (c.error) return row(`<span class="cv blink" style="color:var(--red)">failed · ${esc(c.error)}</span>`);
  if (c.ttl_s == null) return row(`<span class="cv dim">not fetched yet</span>`);

  const col  = c.ttl_s <= 0 ? "var(--red)"
             : c.ttl_s < 60 ? "var(--orange)"
                            : "var(--green)";
  const text = c.ttl_s <= 0 ? `expired ${fmtDur(-c.ttl_s)} ago` : `valid ${fmtDur(c.ttl_s)}`;
  return row(`<span class="cv" style="color:${col}">${text}</span>` +
             `<span class="cage">fetched ${fmtDur(c.age_s)} ago</span>`);
}

function cardHTML(a) {
  const total = (a.ok || 0) + (a.client_err || 0) + (a.server_err || 0) + (a.net_err || 0);
  const pct = n => total ? (100 * n / total) : 0;
  const state = a.reachable ? (a.state || "idle") : "unreachable";
  const checked = a.running ? "checked" : "";
  const disabled = (!a.reachable || busy.has(a.agent_id)) ? "disabled" : "";

  // Blink purely off the last status being an error. No timer and no extra
  // state: it starts when a call fails and stops by itself on the next 2xx,
  // because that re-render drops the class. The agent holds a rejected status
  // for AUTH_RETRY_PAUSE_S, which is what gives this time to be seen at all.
  const lastErr = a.last_status != null && !(a.last_status >= 200 && a.last_status < 300);
  const rejections = (a.api_key && a.api_key.rejections) || 0;

  return `
  <div class="card ${a.reachable ? "" : "unreachable"}" style="--accent:${a.color}">
    <div class="card-head">
      <span class="dot"></span>
      <span class="name">${a.agent_id}</span>
      <span class="badge ${state}">${state}</span>
      ${rejections ? `<span class="rejcount"
        title="Keys revoked out from under this agent since it started. It detected the
        403, discarded the key and minted a replacement each time.">↻${rejections}</span>` : ""}
      <label class="toggle">
        <input type="checkbox" data-agent="${a.agent_id}" ${checked} ${disabled}>
        <span class="slider"></span>
      </label>
    </div>
    <div class="creds">
      ${credRow("🔑", "JWT", a.jwt, {
        title: "Keycloak client-credentials JWT. Minted at pod start and used only to mint " +
               "the MaaS API key, so it normally sits expired while a valid key is cached."})}
      ${credRow("🎫", "KEY", a.api_key, {
        title: "MaaS API key minted with the JWT. This is what every inference call uses."})}
    </div>

    <div class="stats">
      <div class="stat"><div class="k">Requests</div><div class="v">${fmtNum(a.requests)}</div></div>
      <div class="stat"><div class="k">Tokens</div><div class="v">${fmtNum(a.tokens)}</div></div>
      <div class="stat"><div class="k">Uptime</div><div class="v">${fmtDur(a.uptime_seconds)}</div></div>
      <div class="stat"><div class="k">Working</div><div class="v">${fmtDur(a.run_seconds)}</div></div>
      <div class="stat"><div class="k">2xx</div><div class="v ok">${fmtNum(a.ok)}</div></div>
      <div class="stat"><div class="k">4xx</div><div class="v ${a.client_err ? "c4" : ""}">${fmtNum(a.client_err)}</div></div>
      <div class="stat"><div class="k">5xx</div><div class="v ${a.server_err ? "c5" : ""}">${fmtNum(a.server_err)}</div></div>
      <div class="stat"><div class="k">Last</div>
        <div class="v ${lastErr ? "blink" : ""}" style="color:${a.last_status == null ? "var(--comment)"
          : lastErr ? "var(--red)" : "var(--green)"}">
          ${a.last_status ?? "—"}</div></div>
    </div>

    <div class="bar">
      <i class="s2" style="width:${pct(a.ok)}%"></i>
      <i class="s4" style="width:${pct(a.client_err)}%"></i>
      <i class="s5" style="width:${pct((a.server_err || 0) + (a.net_err || 0))}%"></i>
    </div>
    <div class="barlbl">
      <span>success ${ratioText(a.success_ratio)}</span>
      <span title="End-to-end round trip of this agent's most recent inference request, timed inside the agent pod: cross-cluster hop + gateway admission (Envoy wasm, Authorino, Limitador) + model time, until the full response body is read. Excludes credential minting.">${
        a.last_latency_ms != null ? "last e2e " + a.last_latency_ms + "ms" : ""}</span>
    </div>
    ${a.error ? `<div class="err">${a.error}</div>` : ""}
  </div>`;
}

// Bucket agents by group, preserving the order the console registry returned them in
// (registry order = shared.sh's AGENT_IDS), so group blocks are stable across polls.
function byGroup(agents) {
  const order = [];
  const map = new Map();
  for (const a of agents) {
    if (!map.has(a.group)) { map.set(a.group, []); order.push(a.group); }
    map.get(a.group).push(a);
  }
  return order.map(g => [g, map.get(g)]);
}

function groupHTML(name, list) {
  const running = list.filter(a => a.running).length;
  const down = list.filter(a => !a.reachable).length;
  // namespace and pattern are per-group (one agent-profile ConfigMap per namespace),
  // so they belong here rather than repeated on every card. Guard anyway: if a profile
  // were edited in-cluster for one agent only, say "mixed" instead of lying.
  const uniq = k => [...new Set(list.map(a => a[k]).filter(Boolean))];
  const ns = uniq("namespace"), pat = uniq("pattern"), ttl = uniq("key_ttl_seconds");
  const one = v => v.length === 1 ? v[0] : (v.length ? "mixed" : "—");
  return `
  <section class="group" style="--accent:${list[0].color}">
    <div class="group-head">
      <span class="dot"></span>
      <h2>${name}</h2>
      <span class="gmeta">${one(ns)} · ${one(pat)} · key TTL ${
        ttl.length === 1 ? fmtDur(ttl[0]) : one(ttl)} · ${running}/${list.length} running${
        down ? ` · <span style="color:var(--red)">${down} unreachable</span>` : ""}</span>
      <span class="rule"></span>
    </div>
    <div class="row">${list.map(cardHTML).join("")}</div>
  </section>`;
}

function render(data) {
  renderTotals(data.totals);
  renderLegend(data.agents);
  document.getElementById("grid").innerHTML =
    byGroup(data.agents).map(([name, list]) => groupHTML(name, list)).join("");
  for (const el of document.querySelectorAll(".toggle input")) {
    el.addEventListener("change", onToggle);
  }
}

async function onToggle(ev) {
  const id = ev.target.dataset.agent;
  const action = ev.target.checked ? "start" : "stop";
  busy.add(id);
  ev.target.disabled = true;
  try {
    await api(`/api/agents/${id}/${action}`, "POST", {});
  } catch (e) {
    console.error(e);
  } finally {
    busy.delete(id);
    refresh();
  }
}

async function broadcast(action, body) {
  for (const b of document.querySelectorAll("button")) b.disabled = true;
  try {
    render(await api(`/api/${action}`, "POST", body || {}));
  } catch (e) {
    console.error(e);
  } finally {
    for (const b of document.querySelectorAll("button")) b.disabled = false;
    refresh();
  }
}

document.getElementById("startAll").onclick = () => broadcast("start", {});
document.getElementById("stopAll").onclick  = () => broadcast("stop");
document.getElementById("resetAll").onclick = () => broadcast("reset");

async function refresh() {
  const poll = document.getElementById("poll");
  try {
    render(await api("/api/status"));
    lastOk = Date.now();
    poll.textContent = `updated ${new Date().toLocaleTimeString()}`;
    poll.classList.remove("stale");
  } catch (e) {
    poll.textContent = `console unreachable (last update ${
      lastOk ? Math.round((Date.now() - lastOk) / 1000) + "s ago" : "never"})`;
    poll.classList.add("stale");
  }
}

// ── Tabs ────────────────────────────────────────────────────────────────
let activePane = "agents";
for (const t of document.querySelectorAll(".tab")) {
  t.addEventListener("click", () => {
    activePane = t.dataset.pane;
    for (const x of document.querySelectorAll(".tab")) x.classList.toggle("active", x === t);
    for (const p of document.querySelectorAll(".pane")) {
      p.classList.toggle("active", p.id === `pane-${activePane}`);
    }
    if (activePane === "logs") { stickBottom = true; pollLogs(); }
  });
}

// ── Logs ────────────────────────────────────────────────────────────────
// Hard cap on retained lines, so memory is flat no matter how long the tab stays open.
// At the ~0.6 lines/s this fleet produces, 10000 lines is roughly a 4.5-hour window.
// Cost is ~5 DOM nodes per line, so this is tens of MB in the renderer, not hundreds.
const MAX_LOG_LINES = 10000;
let cursors = {};          // agent_id -> last seq already rendered
let logPaused = false;
let stickBottom = true;    // auto-scroll unless the user scrolled up
let logTotal = 0;
let shownCount = 0;
const clsCounts = { "2xx": 0, "201": 0, "4xx": 0, "5xx": 0, "0": 0, other: 0 };
let legendDone = false;

const logview = document.getElementById("logview");
logview.addEventListener("scroll", () => {
  stickBottom = logview.scrollHeight - logview.scrollTop - logview.clientHeight < 40;
});

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// Colour the bracketed HTTP status the agent logs, matching the card stat colours.
function paintStatus(msg) {
  return esc(msg).replace(/\[(\d{3})\]/g, (m, code) => {
    const n = parseInt(code, 10);
    const col = n >= 200 && n < 300 ? "var(--green)" : "var(--red)";
    return `<span style="color:${col};font-weight:700">[${code}]</span>`;
  });
}

function renderLegend(agents) {
  if (legendDone || !agents.length) return;
  const seen = new Map();
  for (const a of agents) if (!seen.has(a.group)) seen.set(a.group, a.color);
  document.getElementById("logLegend").innerHTML =
    [...seen].map(([g, c]) => `<span><i style="background:${c}"></i>${g}</span>`).join("");
  const sel = document.getElementById("logFilter");
  for (const a of agents) {
    const o = document.createElement("option");
    o.value = a.agent_id; o.textContent = a.agent_id;
    sel.appendChild(o);
  }
  legendDone = true;
}

// Bucket a log line by the HTTP status the agent embedded as [NNN].
// Buckets are mutually exclusive, so the chip counts sum to the buffer size.
//
// 201 and 0 get their own buckets rather than folding into 2xx and 5xx: 201 fires only on
// an API-key mint (once an hour per agent) and would be invisible among hundreds of 200s,
// and [0] is the agent's marker for a transport failure with no HTTP response at all,
// which is a different fault from a server returning 5xx.
function statusClass(msg) {
  const m = /\[(\d{1,3})\]/.exec(msg);
  if (!m) return "other";
  const n = Number(m[1]);
  if (n === 201) return "201";
  if (n === 0) return "0";
  if (n >= 200 && n < 300) return "2xx";
  if (n >= 400 && n < 500) return "4xx";
  if (n >= 500) return "5xx";
  return "other";                       // 1xx / 3xx — not produced today
}

function chipFor(cls) { return document.querySelector(`.chip[data-cls="${cls}"]`); }
function classEnabled(cls) { const c = chipFor(cls); return !c || !c.classList.contains("off"); }

function bumpCount(cls, delta) {
  clsCounts[cls] = Math.max(0, (clsCounts[cls] || 0) + delta);
  const c = chipFor(cls);
  if (c) c.querySelector("b").textContent = clsCounts[cls];
}

function visible(agent, el) {
  return (!agent || el.dataset.agent === agent) && classEnabled(el.dataset.cls);
}

function updateLogStatus() {
  document.getElementById("logStatus").textContent =
    `${shownCount}/${logview.childElementCount} line(s) shown` + (logPaused ? " · paused" : "");
}

// Full re-evaluation of the buffer. Only called when a filter actually changes — never on
// the 2s poll, which would mean 2000 style writes a tick. Lines are always appended to the
// buffer and merely hidden, so changing a filter re-reveals everything still buffered.
function applyFilter() {
  const agent = document.getElementById("logFilter").value;
  shownCount = 0;
  for (const el of logview.querySelectorAll(".l")) {
    const ok = visible(agent, el);
    el.style.display = ok ? "" : "none";
    if (ok) shownCount++;
  }
  updateLogStatus();
}

function appendLines(lines) {
  if (!lines.length) return;
  const agent = document.getElementById("logFilter").value;
  const frag = document.createDocumentFragment();
  for (const l of lines) {
    const cls = statusClass(l.msg);
    const el = document.createElement("span");
    el.className = "l";
    el.dataset.agent = l.agent_id;
    el.dataset.cls = cls;
    // Decide visibility once, here, instead of rescanning the whole buffer each poll.
    if (visible(agent, el)) shownCount++; else el.style.display = "none";
    el.innerHTML = `<span class="ts">${esc(l.ts)}</span> ` +
                   `<span class="who" style="color:${l.color}">[${esc(l.agent_id)}]</span> ` +
                   paintStatus(l.msg);
    frag.appendChild(el);
    bumpCount(cls, 1);
  }
  const empty = logview.querySelector(".empty");
  if (empty) empty.remove();
  logview.appendChild(frag);
  logTotal += lines.length;
  // Hard cap on retained lines: bounded memory regardless of how long the tab stays open.
  while (logview.childElementCount > MAX_LOG_LINES) {
    const gone = logview.firstElementChild;
    bumpCount(gone.dataset.cls, -1);                 // keep chip counts == buffer contents
    if (gone.style.display !== "none") shownCount--;
    logview.removeChild(gone);
  }
  if (stickBottom) logview.scrollTop = logview.scrollHeight;
}

async function pollLogs() {
  if (logPaused) return;
  const after = Object.entries(cursors).map(([k, v]) => `${k}:${v}`).join(",");
  try {
    const d = await api(`/api/logs${after ? `?after=${encodeURIComponent(after)}` : ""}`);
    cursors = d.cursors || cursors;
    appendLines(d.lines || []);
    updateLogStatus();
    document.getElementById("logCount").textContent = logTotal ? `(${logTotal})` : "";
  } catch (e) {
    document.getElementById("logStatus").textContent = "log stream unreachable";
  }
}

document.getElementById("logPause").onclick = (e) => {
  logPaused = !logPaused;
  e.target.textContent = logPaused ? "▶ Resume" : "⏸ Pause";
  if (!logPaused) pollLogs();
};
document.getElementById("logClear").onclick = () => {
  logview.innerHTML = '<span class="empty">cleared — new lines will appear here</span>';
  logTotal = 0; shownCount = 0;
  for (const k of Object.keys(clsCounts)) { clsCounts[k] = 0; bumpCount(k, 0); }
  document.getElementById("logCount").textContent = "";
  updateLogStatus();
};
document.getElementById("logFilter").onchange = applyFilter;
for (const chip of document.querySelectorAll(".chip[data-cls]")) {
  chip.addEventListener("click", () => { chip.classList.toggle("off"); applyFilter(); });
}

refresh();
setInterval(refresh, POLL_MS);
setInterval(() => { if (activePane === "logs") pollLogs(); }, POLL_MS);
</script>
</body>
</html>
